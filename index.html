
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkyCast Weather</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
 font-family:Arial,sans-serif;color:#fff;min-height:100vh;
 background:linear-gradient(135deg,#245b91,#65a9d5);
 transition:background .5s;padding:22px
}
body.sunny{background:linear-gradient(135deg,#e58b39,#f5c56b)}
body.rainy{background:linear-gradient(135deg,#263b58,#63839c)}
body.cloudy{background:linear-gradient(135deg,#54677e,#a3b5c5)}
.app{max-width:1100px;margin:auto}
header{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}
.logo{font-size:27px;font-weight:bold}
.small{opacity:.8;font-size:13px;margin-top:5px}
.search{display:flex;gap:8px}
input,button{padding:12px 15px;border:0;border-radius:12px;font-size:15px}
input{width:220px;max-width:55vw}
button{cursor:pointer;background:#fff;color:#244c70;font-weight:bold}
button:hover{opacity:.8}
h2{font-size:19px;margin-bottom:18px}
.panel{background:#ffffff20;border:1px solid #ffffff35;
 backdrop-filter:blur(12px);border-radius:22px;padding:23px;margin-top:22px}
.quick{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}
.quick button{background:#ffffff25;color:white;border:1px solid #ffffff50}
.main-weather{display:grid;grid-template-columns:1.2fr 1fr;gap:20px}
.place{font-size:28px;font-weight:bold}
.date{opacity:.8;margin-top:8px}
.weather-main{display:flex;align-items:center;gap:15px;margin-top:22px}
.big-icon{font-size:76px}
.temp{font-size:64px;font-weight:bold}
.condition{font-size:18px;margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.stat{background:#ffffff20;border-radius:16px;padding:17px}
.stat span{font-size:14px;opacity:.8}
.stat strong{display:block;font-size:22px;margin-top:10px}
.hourly{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}
.hour{min-width:95px;text-align:center;background:#ffffff20;
 padding:16px 10px;border-radius:15px}
.hour div{font-size:28px;margin:13px 0}
.forecast{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:9px}
.day{background:#ffffff20;border-radius:14px;padding:13px 5px;text-align:center}
.day div{font-size:25px;margin:12px 0}
.day p{font-size:13px;margin:7px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
#message{margin-top:16px}
footer{text-align:center;opacity:.8;font-size:12px;margin:25px}
@media(max-width:720px){
 body{padding:14px}
 .main-weather{grid-template-columns:1fr}
 .forecast{grid-template-columns:repeat(2,minmax(0,1fr))}
 .day:last-child{grid-column:auto}
 .temp{font-size:54px}
 .big-icon{font-size:60px}
 header{align-items:flex-start}
 header .search{width:100%}
 .search input{width:100%;max-width:none;min-width:0}
 .search button{white-space:nowrap}
}
</style>
</head>

<body>
<div class="app">
<header>
 <div>
  <div class="logo">☁ SkyCast</div>
  <p class="small">Your world, your weather.</p>
 </div>
 <div class="search">
  <input id="city" placeholder="Search any city...">
  <button onclick="searchCity()">Search</button>
 </div>
</header>

<div class="quick">
 <button onclick="loadCity('Karachi')">Karachi</button>
 <button onclick="loadCity('Lahore')">Lahore</button>
 <button onclick="loadCity('Islamabad')">Islamabad</button>
 <button onclick="loadCity('London')">London</button>
 <button onclick="loadCity('Tokyo')">Tokyo</button>
 <button onclick="loadCity('Dubai')">Dubai</button>
</div>

<p id="message">Loading weather...</p>

<section class="panel main-weather">
 <div>
  <div class="place" id="place">Karachi</div>
  <div class="date" id="date"></div>
  <div class="weather-main">
   <div class="big-icon" id="icon">🌤️</div>
   <div>
    <div class="temp" id="temp">--°</div>
    <div class="condition" id="condition">Loading...</div>
   </div>
  </div>
  <p style="margin-top:20px;opacity:.8" id="range">
   Weather forecast
  </p>
 </div>

 <div class="stats">
  <div class="stat"><span>💧 Humidity</span><strong id="humidity">--%</strong></div>
  <div class="stat"><span>🌬 Wind</span><strong id="wind">-- km/h</strong></div>
  <div class="stat"><span>🌡 Feels like</span><strong id="feels">--°</strong></div>
  <div class="stat"><span>☔ Rain chance</span><strong id="rain">--%</strong></div>
  <div class="stat"><span>🌅 Sunrise</span><strong id="sunrise">--</strong></div>
  <div class="stat"><span>🌇 Sunset</span><strong id="sunset">--</strong></div>
 </div>
</section>

<section class="panel">
 <div class="row">
  <h2>Hourly Forecast</h2>
  <button onclick="toggleUnit()" id="unitBtn">°C / °F</button>
 </div>
 <div class="hourly" id="hourly"></div>
</section>

<section class="panel">
 <h2>📅 Next 7 Days</h2>
 <div class="forecast" id="forecast"></div>
</section>

<section class="panel">
 <h2>🕘 Recent Searches</h2>
 <div class="quick" id="recent"></div>
</section>

<footer>
 Weather data: <a style="color:white" href="https://open-meteo.com/">Open-Meteo</a>
</footer>
</div>

<script>
let fahrenheit = false;
let lastWeather = null;
let recentCities = [];

const codes = {
 0:["Clear sky","☀️"],
 1:["Mainly clear","🌤️"],
 2:["Partly cloudy","⛅"],
 3:["Cloudy","☁️"],
 45:["Foggy","🌫️"],48:["Foggy","🌫️"],
 51:["Light drizzle","🌦️"],53:["Drizzle","🌦️"],
 55:["Heavy drizzle","🌧️"],
 61:["Light rain","🌦️"],63:["Rain","🌧️"],65:["Heavy rain","🌧️"],
 71:["Light snow","🌨️"],73:["Snow","❄️"],75:["Heavy snow","❄️"],
 80:["Rain showers","🌦️"],81:["Rain showers","🌧️"],82:["Heavy showers","⛈️"],
 95:["Thunderstorm","⛈️"],96:["Thunderstorm","⛈️"],99:["Thunderstorm","⛈️"]
};

function info(code){
 return codes[code] || ["Changeable weather","🌤️"];
}

function degrees(c){
 return Math.round(fahrenheit ? c * 9 / 5 + 32 : c) +
        (fahrenheit ? "°F" : "°C");
}

function timeLabel(value){
 return new Date(value).toLocaleTimeString([],{
  hour:"numeric",minute:"2-digit"
 });
}

async function searchCity(){
 const value = document.getElementById("city").value.trim();
 if(value) loadCity(value);
}

async function loadCity(city){
 const message = document.getElementById("message");
 message.textContent = "Searching weather for " + city + "...";

 try{
  const geoURL =
   "https://geocoding-api.open-meteo.com/v1/search?name=" +
   encodeURIComponent(city) + "&count=5&language=en&format=json";

  const geoResponse = await fetch(geoURL);
  if(!geoResponse.ok) throw new Error("City search failed.");
  const geo = await geoResponse.json();

  if(!geo.results || !geo.results.length){
   throw new Error("City not found. Try another spelling.");
  }

  // Choose the closest matching result by city name.
  const place = geo.results.find(x =>
   x.name.toLowerCase() === city.toLowerCase()
  ) || geo.results[0];

  const url = "https://api.open-meteo.com/v1/forecast" +
   "?latitude=" + place.latitude +
   "&longitude=" + place.longitude +
   "&current=temperature_2m,relative_humidity_2m,apparent_temperature," +
   "is_day,precipitation,weather_code,wind_speed_10m" +
   "&hourly=temperature_2m,precipitation_probability,weather_code" +
   "&daily=weather_code,temperature_2m_max,temperature_2m_min," +
   "precipitation_probability_max,sunrise,sunset" +
   "&forecast_days=7&timezone=auto";

  const response = await fetch(url);
  if(!response.ok) throw new Error("Weather data unavailable.");
  const data = await response.json();

  lastWeather = {place,data};
  renderWeather();

  recentCities = [place.name, ...recentCities.filter(
   x => x.toLowerCase() !== place.name.toLowerCase()
  )].slice(0,6);

  renderRecent();
  message.textContent = "Updated with live API data ✓";

 }catch(error){
  message.textContent = error.message || "Please try again.";
 }
}

function renderWeather(){
 const {place,data} = lastWeather;
 const c = data.current;
 const d = data.daily;
 const h = data.hourly;
 const weather = info(c.weather_code);

 document.getElementById("place").textContent =
  place.name + (place.country ? ", " + place.country : "");

 document.getElementById("date").textContent =
  new Date().toLocaleDateString(undefined,{
   weekday:"long",month:"long",day:"numeric"
  });

 document.getElementById("icon").textContent = weather[1];
 document.getElementById("temp").textContent = degrees(c.temperature_2m);
 document.getElementById("condition").textContent = weather[0];
 document.getElementById("humidity").textContent =
  c.relative_humidity_2m + "%";
 document.getElementById("wind").textContent =
  c.wind_speed_10m + " km/h";
 document.getElementById("feels").textContent =
  degrees(c.apparent_temperature);
 document.getElementById("rain").textContent =
  (d.precipitation_probability_max[0] ?? 0) + "%";
 document.getElementById("sunrise").textContent =
  timeLabel(d.sunrise[0]);
 document.getElementById("sunset").textContent =
  timeLabel(d.sunset[0]);
 document.getElementById("range").textContent =
  "H: " + degrees(d.temperature_2m_max[0]) +
  "  •  L: " + degrees(d.temperature_2m_min[0]);

 document.body.className =
  c.weather_code === 0 || c.weather_code === 1 ? "sunny" :
  c.weather_code >= 51 ? "rainy" :
  c.weather_code >= 2 ? "cloudy" : "";

 // Show next 12 hours
 const now = new Date();
 let start = h.time.findIndex(t => new Date(t) >= now);
 if(start < 0) start = 0;
 let hourlyHTML = "";

 for(let i=start; i<Math.min(start+12,h.time.length); i++){
  const w = info(h.weather_code[i]);
  hourlyHTML += `
   <div class="hour">
    <p>${timeLabel(h.time[i])}</p>
    <div>${w[1]}</div>
    <strong>${degrees(h.temperature_2m[i])}</strong>
    <p>${h.precipitation_probability[i] ?? 0}% rain</p>
   </div>`;
 }
 document.getElementById("hourly").innerHTML = hourlyHTML;

 let forecastHTML = "";
 for(let i=0;i<d.time.length;i++){
  const w = info(d.weather_code[i]);
  const day = new Date(d.time[i] + "T12:00:00")
   .toLocaleDateString(undefined,{weekday:"short"});

  forecastHTML += `
   <div class="day">
    <strong>${i===0 ? "Today" : day}</strong>
    <div>${w[1]}</div>
    <p>${w[0]}</p>
    <p><strong>${degrees(d.temperature_2m_max[i])}</strong></p>
    <p>${degrees(d.temperature_2m_min[i])}</p>
    <p>☔ ${d.precipitation_probability_max[i] ?? 0}%</p>
   </div>`;
 }
 document.getElementById("forecast").innerHTML = forecastHTML;
}

function toggleUnit(){
 fahrenheit = !fahrenheit;
 document.getElementById("unitBtn").textContent =
  fahrenheit ? "Switch to °C" : "Switch to °F";
 if(lastWeather) renderWeather();
}

function renderRecent(){
 document.getElementById("recent").innerHTML =
  recentCities.map(city =>
   `<button onclick="loadCity('${city.replace(/'/g,"&#39;")}')">${city}</button>`
  ).join("");
}

document.getElementById("city").addEventListener("keydown",e=>{
 if(e.key === "Enter") searchCity();
});

loadCity("Karachi");
</script>
</body>
</html>
